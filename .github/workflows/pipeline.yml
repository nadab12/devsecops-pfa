name: DevSecOps Pipeline

on: [push]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .

  semgrep-scan:
    runs-on: ubuntu-latest
    needs: build-image
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config auto --error

  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-scan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -t juice-shop:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop:scan
          severity: CRITICAL,HIGH
          exit-code: 1
  deploy:
    runs-on: ubuntu-latest
    needs: [semgrep-scan, gitleaks-scan, trivy-scan]
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            git pull
            docker build -t juice-shop:latest .
            docker stop juice-shop || true
            docker rm juice-shop || true
            docker run -d -p 3000:3000 --name juice-shop juice-shop:latest